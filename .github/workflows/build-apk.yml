name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Instalar o Gradle 9.4.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.4.1'

    - name: Compilar o APK (Debug universal)
      run: gradle assembleUniversalDebug --stacktrace

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/universal/debug/*.apk
